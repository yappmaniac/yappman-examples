name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No outputs, tokens, data files or images
        run: python scripts/check_repo.py
